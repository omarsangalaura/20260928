name: CI CD con Release
on:
  push:
    branches: [ main ]
    # Solo reconoce tags
    tags:
      - 'v*'
jobs:
  build-test-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Configurar JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Compilar el proyecto sin tests
        run: mvn clean package -DskipTests
      - name: Ejecutar servicios para las pruebas
        run: |
          java -jar moduloa/target/moduloa-0.0.1-SNAPSHOT.jar &
          java -jar modulob/target/modulob-0.0.1-SNAPSHOT.jar &
          java -jar moduloc/target/moduloc-0.0.1-SNAPSHOT.jar &
      - name: Ejecutar las pruebas
        run: |
          sleep 30
          mvn test
      - name: Crear release y subir assets
        # Condición ejecución del paso solo si hay tag
        if: startsWith( github.ref, 'refs/tags/v' )
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            moduloa/target/moduloa-0.0.1-SNAPSHOT.jar
            modulob/target/modulob-0.0.1-SNAPSHOT.jar
            moduloc/target/moduloc-0.0.1-SNAPSHOT.jar
        # No olvidar inclusión del token de la máquina virtual en github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Creando el release en GitHub
        # Id para identificar a este paso y sus salidas
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v3.0.1
          release_name: "Release v3.0.1"
          prerelease: 'false'
      - name: Upload de assets en un release (usando upload-release)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./moduloa/target/moduloa-0.0.1-SNAPSHOT.jar
          asset_name: ModuloA.jar
          asset_content_type: application/java-archive
      # El siguiente step no funciona por problemas de vulnerabilidades
      # Otra alternativa
      # - name: Creando release con GtiHub CLI
      #  run: |
      #    gh release create v3.0.1 \
      #    ./moduloa/target/*.jar \
      #    ./modulob/target/*.jar \
      #    ./moduloc/target/*.jar \
      #    --title "Release modo 3 v3.0.1"\
      #    --notes "Release con todos los microservicios compilados."
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  generar-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Configurar JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Compilando todos los módulos
        run: mvn clean package -DskipTests
      - name: Listar todos los ejecutables *.jar
        run: find . -type f -name "*.jar"
      - name: Upload de todos los JARS
        uses: actions/upload-artifact@v7.0.1
        with:
          name: springboot-modulos
          path: |
            moduloa/target/*.jar
            modulob/target/*.jar
            moduloc/target/*.jar
      - name: Download de todos los JARS
        uses: actions/download-artifact@v8.0.1
        with:
          name: springboot-modulos
          path: ./ejecutables
      - name: Mostrando JARs descargados
        run: ls -R ./ejecutables